name: Cloud Compress

# Free Opus compression for Pineapple (app + Telegram bot).
# Flow: upload audio anywhere -> dispatch with {audio_url, job_id, ext} ->
# poll run -> download press-<job_id> artifact (result.opus) -> delete it.
# ffmpeg is preinstalled on ubuntu-latest runners.

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: "Direct URL of the audio/video file"
        required: true
        type: string
      job_id:
        description: "Client-generated id, used in the artifact name"
        required: true
        type: string
      ext:
        description: "File extension without dot (mp3/wav/m4a/ogg/flac/oga/mp4)"
        required: false
        default: "mp3"
        type: string

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download input
        run: |
          mkdir -p in out
          curl -sL --max-time 600 --max-filesize 209715200 \
            -o "in/input.${EXT}" "$AUDIO_URL"
          ls -la in/
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
          EXT: ${{ inputs.ext }}

      - name: Compress to Opus 64k stereo
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -i "in/input.${{ inputs.ext }}" -vn \
            -c:a libopus -b:a 64k -vbr on -compression_level 10 \
            -ar 48000 "out/result.opus"
          ls -la out/

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: press-${{ inputs.job_id }}
          path: out/result.opus
          retention-days: 7
